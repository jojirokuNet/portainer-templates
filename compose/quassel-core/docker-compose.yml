services:
  quassel-core:
    image: linuxserver/quassel-core:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "4242:4242/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/Quassel-core:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
