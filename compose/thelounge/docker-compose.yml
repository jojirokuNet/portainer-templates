services:
  thelounge:
    image: linuxserver/thelounge:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "9000:9000/tcp"
    volumes:
      - "/srv/lsio/thelounge/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
