services:
  plexrequests:
    image: linuxserver/plexrequests:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "3000:3000/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/PlexRequests:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - URL_BASE=${URL_BASE:-}
