services:
  socket-proxy:
    image: linuxserver/socket-proxy:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "80:80/tcp"
    volumes:
      - "/srv/lsio/socket-proxy/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
