services:
  scality-s3:
    image: scality/s3server:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8000/tcp"
    volumes:
      - "/usr/src/app/localData"
      - "/usr/src/app/localMetadata"
    environment:
      - SCALITY_ACCESS_KEY=${SCALITY_ACCESS_KEY:-}
      - SCALITY_SECRET_KEY=${SCALITY_SECRET_KEY:-}
