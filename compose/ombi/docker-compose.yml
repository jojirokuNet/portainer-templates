services:
  ombi:
    image: linuxserver/ombi:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "3579:3579/tcp"
    volumes:
      - "/srv/lsio/ombi/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - BASE_URL=${BASE_URL:-/}
