services:
  jackett:
    image: linuxserver/jackett:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "9117:9117/tcp"
    volumes:
      - "/srv/lsio/jackett/config:/config"
      - "/srv/lsio/jackett/downloads:/downloads"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      - RUN_OPTS=${RUN_OPTS:-}
