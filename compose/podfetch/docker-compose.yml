services:
  podfetch:
    image: samuel19982/podfetch:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8000:8000/tcp"
    volumes:
      - "/portainer/Files/AppData/PodFetch/podcasts:/app/podcasts"
      - "/portainer/Files/AppData/PodFetch/db:/app/db"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/db/podcast.db}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-300}
      - BASIC_AUTH=${BASIC_AUTH:-false}
      - USERNAME=${USERNAME:-}
      - PASSWORD=${PASSWORD:-}
      - GPODDER_INTEGRATION_ENABLED=${GPODDER_INTEGRATION_ENABLED:-false}
