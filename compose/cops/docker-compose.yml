services:
  cops:
    image: linuxserver/cops:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - "/srv/lsio/cops/config:/config"
      - "/srv/lsio/cops/books:/books"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
