services:
  openvpn-as-1:
    image: linuxserver/openvpn-as:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "943/tcp"
      - "9443/tcp"
      - "1194/udp"
    volumes:
      - "/config"
    environment:
      - INTERFACE=${INTERFACE:-eth0}
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
      - TZ=${TZ:-America/Chicago}
