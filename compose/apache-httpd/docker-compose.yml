services:
  apache-httpd:
    image: httpd:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8080:80/tcp"
      - "8443:443/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/apache-httpd:/usr/local/apache2/htdocs/"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
