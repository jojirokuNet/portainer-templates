services:
  homeassistant:
    image: linuxserver/homeassistant:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8123:8123/tcp"
    volumes:
      - "/srv/lsio/homeassistant/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
