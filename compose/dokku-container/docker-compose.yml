services:
  dokku-container:
    image: dokku/dokku:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "22/tcp"
      - "80/tcp"
      - "443/tcp"
    volumes:
      - "/var/lib/dokku:/mnt/dokku"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - DOKKU_HOSTNAME=${DOKKU_HOSTNAME:-}
      - DOKKU_HOST_ROOT=${DOKKU_HOST_ROOT:-/var/lib/dokku/home/dokku}
