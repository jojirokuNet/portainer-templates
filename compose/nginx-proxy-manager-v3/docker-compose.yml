services:
  nginx-proxy-manager-v3:
    image: jc21/nginx-proxy-manager:v3
    restart: unless-stopped
    platform: "linux"
    ports:
      - "80:80/tcp"
      - "81:81/tcp"
      - "443:443/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/nginx-proxy-manager-v3/data:/data"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
