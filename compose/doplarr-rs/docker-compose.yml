services:
  doplarr-rs:
    image: linuxserver/doplarr_rs:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "80:80/tcp"
    volumes:
      - "/srv/lsio/doplarr_rs/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
