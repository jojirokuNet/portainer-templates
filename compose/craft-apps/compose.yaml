services:
  craft-apps:
    image: linuxserver/craft-apps:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "3000:3000/tcp"
      - "3001:3001/tcp"
    volumes:
      - "/srv/lsio/craft-apps/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
