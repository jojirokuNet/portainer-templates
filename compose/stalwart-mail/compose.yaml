services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8080:8080/tcp"
      - "443:443/tcp"
      - "25:25/tcp"
      - "587:587/tcp"
      - "465:465/tcp"
      - "143:143/tcp"
      - "993:993/tcp"
    volumes:
      - "/etc/stalwart"
      - "/var/lib/stalwart"
    environment:
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN:-}
