services:
  ungoogled-chromium:
    image: linuxserver/ungoogled-chromium:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "3000:3000/tcp"
      - "3001:3001/tcp"
    volumes:
      - "/srv/lsio/ungoogled-chromium/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - CHROME_CLI=${CHROME_CLI:-https://www.linuxserver.io/}
