services:
  limnoria:
    image: linuxserver/limnoria:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8080:8080/tcp"
    volumes:
      - "/srv/lsio/limnoria/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
