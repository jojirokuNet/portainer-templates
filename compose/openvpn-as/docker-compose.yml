services:
  openvpn-as:
    image: linuxserver/openvpn-as:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "943:943/tcp"
      - "9443:9443/tcp"
      - "1194:1194/udp"
    volumes:
      - "/portainer/Files/AppData/Config/OpenVPN-AS:/config"
    environment:
      - INTERFACE=${INTERFACE:-eth0}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
