services:
  linkding:
    image: sissbruecker/linkding:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "9090:9090/tcp"
    volumes:
      - "/etc/linkding/data"
    environment:
      - LD_SUPERUSER_NAME=${LD_SUPERUSER_NAME:-admin}
      - LD_SUPERUSER_PASSWORD=${LD_SUPERUSER_PASSWORD:-changeme}
      - LD_SUPERUSER_EMAIL=${LD_SUPERUSER_EMAIL:-}
