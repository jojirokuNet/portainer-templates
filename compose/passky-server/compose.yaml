services:
  passky-server:
    image: rabbitcompany/passky-server:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8080:80/tcp"
    volumes:
      - "/portainer/Files/AppData/Passky-Server:/var/www/html/databases"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
