services:
  flame:
    image: pawelmalak/flame:multiarch
    restart: unless-stopped
    platform: "linux"
    ports:
      - "5005:5005/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/Flame/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - PASSWORD=${PASSWORD:-}
