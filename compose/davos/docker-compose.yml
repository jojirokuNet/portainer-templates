services:
  davos:
    image: linuxserver/davos:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8080/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/Davos:/config"
      - "/portainer/Downloads:/downloads"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
