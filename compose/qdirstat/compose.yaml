services:
  qdirstat:
    image: linuxserver/qdirstat:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "3000:3000/tcp"
      - "3001:3001/tcp"
    volumes:
      - "/srv/lsio/qdirstat/config:/config"
      - "/srv/lsio/qdirstat/data:/data"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
