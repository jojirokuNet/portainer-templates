services:
  elasticsearch:
    image: elasticsearch:9.5.3
    restart: unless-stopped
    platform: "linux"
    ports:
      - "9200/tcp"
      - "9300/tcp"
    volumes:
      - "/usr/share/elasticsearch/data"
    environment:
      - discovery.type=${discovery.type:-single-node}
      - xpack.security.enabled=${xpack.security.enabled:-false}
