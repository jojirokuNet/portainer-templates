services:
  prowlarr:
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "9696:9696/tcp"
    volumes:
      - "/srv/lsio/prowlarr/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
