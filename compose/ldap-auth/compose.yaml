services:
  ldap-auth:
    image: linuxserver/ldap-auth:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8888:8888/tcp"
      - "9000:9000/tcp"
    volumes:
      - "/srv/lsio/ldap-auth/config:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - FERNETKEY=${FERNETKEY:-}
      - CERTFILE=${CERTFILE:-}
      - KEYFILE=${KEYFILE:-}
