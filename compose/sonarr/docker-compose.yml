services:
  sonarr:
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8989:8989/tcp"
    volumes:
      - "/srv/lsio/sonarr/config:/config"
      - "/srv/lsio/sonarr/tv:/tv"
      - "/srv/lsio/sonarr/downloads:/downloads"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
