services:
  sickchill:
    image: linuxserver/sickchill:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8081:8081/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/SickChill:/config"
      - "/portainer/Downloads:/downloads"
      - "/portainer/TV:/tv"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
