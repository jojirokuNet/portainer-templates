services:
  syncthing:
    image: linuxserver/syncthing:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "8384:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - "/srv/lsio/syncthing/config:/config"
      - "/srv/lsio/syncthing/data1:/data1"
      - "/srv/lsio/syncthing/data2:/data2"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
