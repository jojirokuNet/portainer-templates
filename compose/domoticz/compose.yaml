services:
  domoticz:
    image: linuxserver/domoticz:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "1443:1443/tcp"
      - "6144:6144/tcp"
      - "8080:8080/tcp"
    volumes:
      - "/portainer/Files/AppData/Config/Domoticz:/config"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
