services:
  webgrabplus:
    image: linuxserver/webgrabplus:latest
    restart: unless-stopped
    platform: "linux"
    ports:
      - "80:80/tcp"
    volumes:
      - "/srv/lsio/webgrabplus/config:/config"
      - "/srv/lsio/webgrabplus/data:/data"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
